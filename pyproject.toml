[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themeshift"
version = "1.2.0"
description = "Extensible theme migration toolkit with a lightweight local Web workspace."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "themeshift contributors" }]
keywords = ["theme", "icon-pack", "xiaomi", "miui", "mtz", "honor", "hnt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
web = [
  "fastapi>=0.121,<1.0",
  "starlette>=0.49.1,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.34,<1.0",
  "python-multipart>=0.0.22,<1.0",
]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27,<1.0", "build>=1.2"]

[project.scripts]
themeshift = "themeshift.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/themeshift"
Issues = "https://github.com/OWNER/themeshift/issues"
Changelog = "https://github.com/OWNER/themeshift/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themeshift = ["data/**/*.json", "web/static/*.html", "web/static/*.css", "web/static/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long CJK strings and table-like literals are common here; wrapping is handled
# in review rather than by the linter.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["themeshift", "tests"]
