name: 功能建议
description: 新平台、新映射规则或行为改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 变更类型
      options:
        - 新增平台
        - 补充包名映射
        - 输出格式/规范
        - CLI 体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 官方文档、应用包名证据等
